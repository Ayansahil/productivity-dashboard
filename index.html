<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
   
  </head>
  <body>
    <div class="main">
      <nav></nav>
      <section class="allFeatures">
        <div class="todo elem" id="0">
          <img
            src="https://images.unsplash.com/photo-1641261689141-ee46b8a0470c?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
          />
          <h2>To Do List</h2>
        </div>

        <div class="daily elem" id="1">
          <img
            src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/21ae21dc-d844-419a-903f-9cb310f16a00/dl2maj4-ecbbfa7c-535f-40f2-8acf-e7bfad6460eb.jpg?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi8yMWFlMjFkYy1kODQ0LTQxOWEtOTAzZi05Y2IzMTBmMTZhMDAvZGwybWFqNC1lY2JiZmE3Yy01MzVmLTQwZjItOGFjZi1lN2JmYWQ2NDYwZWIuanBnIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.j54n6Hi8bTiGJXWh5GcI_0XYlQ8cNkdnrmpx0aQQRSo"
            alt=""
          />
          <h2>Daily Planner</h2>
        </div>

        <div class="moti elem" id="2">
          <img
            src="https://i.pinimg.com/736x/5a/8d/65/5a8d655ffbed9a4a73828a88d12eb370.jpg"
            alt=""
          />
          <h2>Motivation</h2>
        </div>

        <div class="pomo elem" id="3">
          <img
            src="https://i.pinimg.com/1200x/d2/06/34/d206344d44ebd4e45c5108751f9c3a13.jpg"
            alt=""
          />
          <h2>Pomodoro</h2>
        </div>

        <div class="goals elem" id="4">
          <img
            src="https://i.pinimg.com/736x/4b/5d/8b/4b5d8bee87016667e5302738eea1d431.jpg"
            alt=""
          />
          <h2>Daily Goals</h2>
        </div>
      </section>

      <section class="fullElem todo-list-fullpage">
        <button class="back" id="0">Close</button>

        <h2>Personalized Todo List</h2>

        <div class="todo-container">
          <div class="addTask">
            <form>
              <input id="task-inp" type="text" placeholder="Enter Task" />

              <textarea
                placeholder="Enter Details"
                cols="30"
                rows="10"
              ></textarea>

              <div class="mark">
                <input type="checkbox" id="check" />
                <label for="check">Mark as Important!</label>
              </div>

              <!-- submit is correct here -->
              <button>Add Task</button>
            </form>
          </div>

          <div class="allTask"></div>
        </div>
      </section>

      <section class="fullElem daily-planner-fullpage">
        <button class="back" id="1">Close</button>
        <h2>Plan your Day to be more Productive</h2>
        <div class="day-planner"></div>
      </section>

      <section class="fullElem motivation-fullpage">
        <button class="back" id="2">Close</button>
        <h2>Motivational Quotes</h2>
        <div class="motivation-fullPage-container">
          <div class="motivation-container">
            <div class="motivation-wrapper">
              <div class="motivation-1">
                <h2>Quote of the Day </h2>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="fullElem pomodoro-fullpage">
        <button class="back" id="3">Close</button>
        <h1>Pomodoro Timer</h1>
      </section>

      <section class="fullElem daily-goals-fullpage">
        <button class="back" id="4">Close</button>
        <h1>Daily Goals</h1>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>

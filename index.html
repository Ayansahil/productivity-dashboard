<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_HOw1CVkrPPmO2nok8MlnGpd88vI5GnGcRA&s"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main">
      <section class="allElems">
        <header>
          <div class="header-overlay"></div>
          <div class="header-glow"></div>
          <div class="header-content">
            <div class="header1">
              <h2>20 April 2025</h2>
              <h1>Saturday, 1:00 pm</h1>
              <h4>Bhopal (MP)</h4>
            </div>

            <div class="header2">
              <div class="weather-icon">
                <div class="weather-circle"></div>
                <div class="weather-glow"></div>
              </div>
              <h2>20°C</h2>
              <h4>Light rain</h4>
              <div class="weather-details">
                <h3 class="precipitation">Precipitation: 35%</h3>
                <h3 class="humidity">Humidity: 49%</h3>
                <h3 class="wind">Wind: 10 km/h</h3>
              </div>
            </div>
          </div>
        </header>

        <section class="allFeatures">
          <div class="todo elem" id="0">
            <div class="elem-overlay"></div>
            <div class="elem-gradient"></div>
            <div class="elem-shine"></div>
            <img
              src="./images/img1.webp"
              alt=""
            />
            <div class="elem-content">
              <h2>To Do List</h2>
            </div>
          </div>

          <div class="daily elem" id="1">
            <div class="elem-overlay"></div>
            <div class="elem-gradient"></div>
            <div class="elem-shine"></div>
            <img
              src="./images/img2.webp"
              alt=""
            />
            <div class="elem-content">
              <h2>Daily Planner</h2>
            </div>
          </div>

          <div class="moti elem" id="2">
            <div class="elem-overlay"></div>
            <div class="elem-gradient"></div>
            <div class="elem-shine"></div>
            <img
              src="./images/img3.webp"
              alt=""
            />
            <div class="elem-content">
              <h2>Motivation</h2>
            </div>
          </div>

          <div class="pomo elem" id="3">
            <div class="elem-overlay"></div>
            <div class="elem-gradient"></div>
            <div class="elem-shine"></div>
            <img
              src="https://i.pinimg.com/1200x/d2/06/34/d206344d44ebd4e45c5108751f9c3a13.jpg"
              alt=""
            />
            <div class="elem-content">
              <h2>Pomodoro</h2>
            </div>
          </div>

          <div class="goals elem" id="4">
            <div class="elem-overlay"></div>
            <div class="elem-gradient"></div>
            <div class="elem-shine"></div>
            <img
              src="https://i.pinimg.com/736x/4b/5d/8b/4b5d8bee87016667e5302738eea1d431.jpg"
              alt=""
            />
            <div class="elem-content">
              <h2>Daily Goals</h2>
            </div>
          </div>
        </section>
      </section>

      <section class="fullElem todo-list-fullpage">
        <button class="back" id="0">Close</button>

        <h2>Personalized Todo List</h2>

        <div class="todo-container">
          <div class="addTask">
            <form>
              <input id="task-inp" type="text" placeholder="Enter Task" />

              <textarea
                placeholder="Enter Details"
                cols="30"
                rows="10"
              ></textarea>

              <div class="mark">
                <input type="checkbox" id="check" />
                <label for="check">Mark as Important!</label>
              </div>

              <!-- submit is correct here -->
              <button>Add Task</button>
            </form>
          </div>

          <div class="allTask"></div>
        </div>
      </section>

      <section class="fullElem daily-planner-fullpage">
        <button class="back" id="1">Close</button>
        <h2>Plan your Day to be more Productive</h2>
        <div class="day-planner"></div>
      </section>

      <section class="fullElem motivation-fullpage">
        <button class="back" id="2">Close</button>
        <h2>Motivational Quotes</h2>
        <div class="motivation-fullPage-container">
          <div class="motivation-container">
            <div class="motivation-wrapper">
              <div class="motivation-1">
                <h2></h2>
                <div class="motivation-2">
                  <h3></h3>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="fullElem pomodoro-fullpage">
        <button class="back" id="3">Close</button>
        <h2>Pomodoro Timer</h2>

        <div class="pomo-timer">
          <h1>25:00</h1>
          <button class="start-timer">Start</button>
          <button class="pause-timer">Pause</button>
          <button class="reset-timer">Reset</button>
        </div>
      </section>

      <section class="fullElem daily-goals-fullpage">
        <button class="back" id="4">Close</button>
        <h2>Daily Goals</h2>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
